<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>EdgeSearch</title>
  <link rel="stylesheet" href="/styles.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <main>
    <h1><a href="/">EdgeSearch</a></h1>
    <form role="search">
      <label for="query">Search the web</label>
      <div class="search"><input id="query" name="q" type="search" required maxlength="499" autocomplete="off"><button>Search</button></div>
    </form>
    <p id="status" role="status" aria-live="polite"></p>
    <ol id="results"></ol>
    <footer><a href="/api/v1/search?q=cloudflare">JSON API</a> · <a href="https://github.com/PeronGH/edgesearch">Source</a></footer>
  </main>
</body>
</html>
